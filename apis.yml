description: >-
  Fox Corporation (NASDAQ: FOXA, FOX) is a US media company spun out of 21st
  Century Fox in 2019 when the rest of the business was sold to Disney. Per the
  company website, "Fox Corporation produces and distributes compelling news,
  sports, and entertainment content through its primary iconic domestic brands"
  — Fox News Media (Fox News Channel, Fox Business Network, Fox News Digital,
  Fox News Audio, Fox Weather), Fox Sports (FS1, FS2, Big Ten Network, Fox
  Deportes, Fox Bet partnerships), Fox Entertainment, Fox Television Stations,
  and the Tubi Media Group (Tubi free ad-supported streaming, Credible). In May
  2024 Fox acquired Mexican sports-betting and casino operator Caliente.mx,
  expanding its sports-and-wagering footprint into Latin America. Fox does not
  publish a public developer portal or REST API surface for the parent
  corporation — programmatic distribution is delivered via per-brand RSS / Atom
  feeds (Fox News, Fox Business, Fox Sports, Fox Weather), the Tubi Media Group
  open source projects on GitHub (github.com/Tubitv, 53 public repositories),
  and direct B2B advertising and content-syndication relationships rather than
  self-serve API signup. This apis.yml therefore catalogs the public RSS
  surface, Tubi engineering OSS, and the corporate/brand web properties.
