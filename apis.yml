  - type: Features
    data:
      - name: Fox One Streaming Bundle
        description: >-
          Direct-to-consumer streaming service that aggregates Fox News, Fox
          Sports, Fox Weather, and Fox Entertainment content into a single
          subscription, launched fiscal 2026.
      - name: Tubi Free Ad-Supported Streaming
        description: >-
          Free ad-supported streaming TV (FAST/AVOD) service with movies, TV
          shows, live news, sports, and the Creatorverse independent-creator
          channel; partnerships with A&E, FOX, Hallmark, Lifetime, and others;
          available on iOS, Android, Roku, Amazon Fire, and web; bilingual
          English / Spanish.
      - name: Tubi Engineering Open Source
        description: >-
          Tubi maintains a public GitHub org at github.com/Tubitv with 53
          repositories spanning streaming/media (TubiPlayer, ExoPlayer fork,
          hls.js fork), Elixir backend libraries (grpc, protobuf, redis_cluster,
          logger_sentry, overseer, AutoError, ex_country_data, ex_loader,
          ex-datadog-plug), Roku/Brightscript utilities (rodash), JupyterLab
          extensions, and the xdiff Rust API-diff tool; engineering blog at
          code.tubitv.com.
      - name: Caliente.mx Acquisition
        description: >-
          Fox Corporation acquired a majority stake in Caliente.mx in May 2024,
          taking control of one of Mexico's largest sports-betting and online
          casino operators. The deal extends the Fox Bet wagering thesis into
          Latin America after Fox's earlier US-market Fox Bet joint venture
          with Flutter was wound down.
      - name: Fox News Moxie / google-publisher RSS Platform
        description: >-
          Fox News, Fox Business, and Fox Weather all serve their public RSS /
          Atom feeds from a shared moxie.<brand>.com/google-publisher/<topic>.xml
          CDN pattern (with HTTP/2, ETag, and X-Amzn-Requestid headers indicating
          an AWS-fronted delivery tier). The naming aligns with Google
          Publisher Center ingestion conventions, so the same feeds power Google
          News distribution as well as third-party RSS aggregators.
      - name: Fox Sports optimized-rss Platform
        description: >-
          Fox Sports exposes 24 league/topic RSS feeds via a single
          api.foxsports.com/v2/content/optimized-rss endpoint scoped by a public
          partnerKey query parameter and tag filters
          (size, tags, aggregateId, content_type, component_type). Tag values
          follow a stable taxonomy (fs/nfl, fs/mlb, fs/cfb, soccer/epl/league/1,
          etc.) that could be machine-introspected for additional sports
          beyond those listed on the public RSS index page.
      - name: Fox Television Stations Local Footprint
        description: >-
          Fox owns and operates 29 local broadcast television stations across 14
          US markets (the largest duopoly portfolio in US local broadcast),
          plus the streaming Fox Local app distributing local news and weather
          from each FTS market.
      - name: Fox Bet Wind-Down and Caliente Reset
        description: >-
          The original Fox Bet US sportsbook joint venture with Flutter
          Entertainment was wound down in 2023; the Caliente.mx acquisition
          (May 2024) repositions Fox's sports-wagering exposure into the
          Mexican market under an established local operator brand.
  - type: Segments
    data:
      - name: Cable Network Programming
        description: Affiliate fees and advertising from Fox News Channel, Fox Business Network, FS1, FS2, and Big Ten Network.
      - name: Television
        description: Fox broadcast network, 29 owned-and-operated Fox Television Stations, Fox Entertainment studios, and the Tubi Media Group ad-supported streaming business.
      - name: Other Corporate and Eliminations
        description: Corporate overhead, Fox Sports betting partnerships, the Caliente.mx investment, and intercompany eliminations.
  - type: UseCases
    data:
      - name: News Headline Syndication
        description: Third-party news aggregators, content licensees, and downstream apps consume Fox News / Fox Business / Fox Weather RSS feeds to re-syndicate headlines, descriptions, and canonical URLs.
      - name: Google News Distribution
        description: The moxie / google-publisher feed naming maps directly onto Google Publisher Center ingestion so Fox brand content surfaces in Google News and Discover.
      - name: Sports Topic Tracking
        description: Sportsbook operators, fantasy services, and sports-news aggregators consume the per-league Fox Sports optimized-rss feeds (NFL, MLB, NBA, NHL, soccer leagues) for editorial coverage tied to game events.
      - name: Streaming Player Integrations
        description: Tubi's open-source TubiPlayer, ExoPlayer fork, and hls.js fork are used in Tubi's own Android, Roku, and web clients and are referenced in the wider streaming-media engineering community.
      - name: Investor and Press Distribution
        description: Investor email alerts and the press-releases page provide first-party investor relations distribution; no first-party RSS feed for press releases or SEC filings is published.
      - name: Caliente Sports Betting (Mexico)
        description: Direct-to-consumer sportsbook and online-casino product operated under the Caliente brand in Mexico following the May 2024 Fox acquisition.
  - type: Integrations
    data:
      - name: Google Publisher Center
        description: Fox News, Fox Business, and Fox Weather RSS feeds follow the Google Publisher Center naming convention (moxie/google-publisher/*.xml) for Google News ingestion.
      - name: Flutter Entertainment (historical)
        description: Fox's original Fox Bet US sportsbook joint venture with Flutter; wound down in 2023.
      - name: Caliente.mx
        description: Mexican sports-betting and online-casino operator; majority stake acquired by Fox in May 2024.
      - name: Spotify / Apple Podcasts / iHeartRadio
        description: Fox News and Fox Business podcasts distributed through major podcast platforms in addition to radio.foxnews.com.
      - name: Flipboard
        description: Fox News and Fox Business maintain Flipboard storyboards as a secondary syndication channel.
